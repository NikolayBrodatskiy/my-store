name: ci-cd

on:
  push:
    branches: ['main']

jobs:
  deploy:
    runs-on: self-hosted
    permissions: write-all
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: 'false'

      - name: Export secrets and vars to local env
        uses: easyware-io/export-to-env@v1
        with:
          vars: ${{ toJSON(vars) }}

      - name: Stop all containers
        run: docker compose stop $(docker ps -a -q) || true

      - name: Remove unused containers.
        run: docker compose rm $(docker ps --filter status=exited -q) || true

      - name: Remove unused images.
        run: docker compose image prune -a -f || true

      - name: Remove remove anonymous local volumes.
        run:  docker compose volume prune -f || true

#      - name: Copy .env
#        run: cp .env.production .env

#      - name: Docker compose up
#        run: docker compose -f docker-compose.prod.yml up -d

      - run: docker compose exec app composer install --no-dev
      - run: docker compose exec app npm install
      - run: docker compose exec app npm run build
      - run: docker compose exec app php artisan config:clear
      - run: docker compose exec app php artisan cache:clear
      - run: docker compose exec app php artisan migrate --force
      - run: docker compose exec app php artisan key:generate
      - run: docker compose exec app php artisan app:install
      - run: docker compose exec app chmod -R 777 ./storage
      - run: docker compose exec app chmod -R 775 ./bootstrap/cache
      - run: docker compose exec app supervisord || true
      - run: docker compose exec app php artisan optimize
