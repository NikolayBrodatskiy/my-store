services:
    nginx:
        image: nginx:stable
        volumes:
            - ./.docker/nginx/conf.d:/etc/nginx/conf.d
            - ./:/var/www
        ports:
            - '${APP_PORT:-8080}:80'
        depends_on:
            app:
                condition: service_started

    app:
        build:
            context: .
            dockerfile: .docker/app/Dockerfile
        image: ${PROJECT_NAME:-mystore}-app
        volumes:
            - ./:/var/www
        ports:
            - '${VITE_PORT:-5173}:5173'
        environment:
            PHP_IDE_CONFIG: "serverName=${PROJECT_NAME:-mystore}"
            XDEBUG_CONFIG: "idekey=PHPSTORM"
        depends_on:
            db:
                condition: service_healthy

    db:
        image: postgres:18
        shm_size: 128mb
        volumes:
            - db-data:/var/lib/postgresql
        environment:
            - POSTGRES_DB=${DB_DATABASE}
            - POSTGRES_USER=${DB_USERNAME}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
        ports:
            - '${DB_PORT:-5432}:5432'
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}" ]
            interval: 10s
            retries: 5
            start_period: 30s
            timeout: 10s

    redis:
        image: redis:alpine
        restart: unless-stopped
        ports:
            - "6379:6379"

volumes:
    db-data:
        name: "${PROJECT_NAME:-mystore}-db-data"
